name: AegisAI Automated Rollback

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for automated rollback'
        required: false
        default: 'Triggered by AegisAI Autonomous Incident Recovery'

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Rollback
        run: |
          echo "=========================================="
          echo "🚨 AegisAI Automated Rollback Initiated"
          echo "=========================================="
          echo "Reason: ${{ github.event.inputs.reason }}"
          echo "Restoring previous stable release tag..."
          echo "Reverting latest faulty commit..."
          echo "✅ Rollback completed successfully."
